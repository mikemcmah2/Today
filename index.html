<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Today</title>
<meta name="description" content="A one-tap nightly check-in." />

<!-- Home screen / PWA setup -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Today" />
<meta name="theme-color" content="#191C22" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink: #191C22;
    --ink-2: #21252d;
    --cream: #E8DFCE;
    --cream-dim: #A9A399;
    --sage: #6B8F71;
    --sage-bright: #7FA687;
    --terracotta: #B5533C;
    --terracotta-bright: #C7654D;
    --ring-track: #2B2F38;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    height: 100%;
    margin: 0;
    background: var(--ink);
    color: var(--cream);
    font-family: 'Inter', system-ui, sans-serif;
    overscroll-behavior: none;
  }

  body{
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px;
    min-height: 100dvh;
  }

  .app{
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* --- Tab bar --- */
  .tabbar{
    display: flex;
    gap: 4px;
    background: var(--ink-2);
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 26px;
  }

  .tab{
    border: none;
    background: transparent;
    color: var(--cream-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 9px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  .tab.active{ background: var(--ink); color: var(--cream); }

  .view{
    width: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
  }
  .view.active{ display: flex; }

  .eyebrow{
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--cream-dim);
    font-weight: 500;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 34px;
    margin: 2px 0 4px;
    letter-spacing: -0.01em;
  }

  .subtitle{
    font-size: 14px;
    color: var(--cream-dim);
    margin-bottom: 22px;
    text-align: center;
  }

  /* --- Ring chart --- */
  .ring-wrap{
    position: relative;
    width: min(58vw, 260px);
    height: min(58vw, 260px);
    margin-bottom: 8px;
  }

  .ring-wrap svg{ width: 100%; height: 100%; transform: rotate(-90deg); }

  .ring-track{ fill: none; stroke: var(--ring-track); stroke-width: 14; }
  .ring-seg{
    fill: none;
    stroke-width: 14;
    stroke-linecap: round;
    transition: stroke-dasharray 0.6s cubic-bezier(.4,0,.2,1);
  }

  .ring-center{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .ring-pct{
    font-family: 'Fraunces', serif;
    font-size: 44px;
    font-weight: 500;
    line-height: 1;
    color: var(--sage-bright);
  }
  .ring-pct.low{ color: var(--terracotta-bright); }
  .ring-pct.empty{ color: var(--cream-dim); }

  .ring-label{
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--cream-dim);
    margin-top: 4px;
  }

  /* --- Buttons --- */
  .buttons{
    display: flex;
    gap: 14px;
    width: 100%;
    margin-top: 22px;
  }

  .btn{
    flex: 1;
    border: none;
    border-radius: 18px;
    padding: 20px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease, opacity 0.15s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  .btn:active{ transform: scale(0.96); }

  .btn-green{ background: var(--sage-bright); }
  .btn-red{ background: var(--terracotta-bright); }

  .btn.dim{ opacity: 0.45; filter: saturate(0.7); }
  .btn.selected{ outline: 2px solid var(--cream); outline-offset: 2px; }

  .status{
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--cream-dim);
    text-align: center;
    min-height: 16px;
  }

  .status b{ color: var(--cream); font-weight: 600; }

  .totals{
    margin-top: 26px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--cream-dim);
    font-variant-numeric: tabular-nums;
  }

  .dot{ width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.g{ background: var(--sage-bright); }
  .dot.r{ background: var(--terracotta-bright); }

  .totals span.count{ color: var(--cream); font-weight: 600; }

  .divider{ width: 1px; height: 12px; background: var(--ring-track); }

  /* --- History / calendar --- */
  .cal-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 18px;
  }

  .cal-nav{
    border: none;
    background: var(--ink-2);
    color: var(--cream);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s ease;
  }
  .cal-nav:active{ transform: scale(0.94); }
  .cal-nav:disabled{ opacity: 0.3; cursor: default; }

  .cal-month{
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 500;
  }

  .cal-weekdays{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    width: 100%;
    margin-bottom: 8px;
  }
  .cal-weekdays div{
    text-align: center;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--cream-dim);
  }

  .cal-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    width: 100%;
  }

  .cal-cell{
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 500;
    color: var(--cream-dim);
    background: var(--ring-track);
    border: none;
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
  }
  .cal-cell.empty-slot{ background: transparent; }
  .cal-cell.has-entry{ color: var(--ink); font-weight: 600; }
  .cal-cell.green{ background: var(--sage-bright); }
  .cal-cell.red{ background: var(--terracotta-bright); }
  .cal-cell.today-marker{ outline: 2px solid var(--cream); outline-offset: 2px; }
  .cal-cell.future{ opacity: 0.35; }
  .cal-cell.clickable{ cursor: pointer; }
  .cal-cell.selected{ outline: 2px solid var(--cream); outline-offset: 2px; }

  .cal-summary{
    margin-top: 18px;
    font-size: 13px;
    color: var(--cream-dim);
    text-align: center;
  }
  .cal-summary span.count{ color: var(--cream); font-weight: 600; }

  .editor{
    margin-top: 18px;
    width: 100%;
    background: var(--ink-2);
    border-radius: 16px;
    padding: 14px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .editor.active{ display: flex; }
  .editor-label{ font-size: 13px; color: var(--cream); font-weight: 600; }
  .editor-buttons{ display: flex; gap: 8px; width: 100%; }
  .editor-buttons button{
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink);
  }
  .editor-buttons .e-green{ background: var(--sage-bright); }
  .editor-buttons .e-red{ background: var(--terracotta-bright); }
  .editor-buttons .e-clear{ background: var(--ring-track); color: var(--cream); }

  @media (max-width: 340px){
    h1{ font-size: 28px; }
    .ring-pct{ font-size: 36px; }
  }
</style>
</head>
<body>

  <div class="app">
    <div class="tabbar">
      <button class="tab active" id="tabToday">Today</button>
      <button class="tab" id="tabHistory">History</button>
    </div>

    <!-- TODAY VIEW -->
    <div class="view active" id="view-today">
      <div class="eyebrow" id="dateLabel">—</div>
      <h1>Today</h1>
      <div class="subtitle">How did today go, together?</div>

      <div class="ring-wrap">
        <svg viewBox="0 0 100 100">
          <circle class="ring-track" cx="50" cy="50" r="42"></circle>
          <circle class="ring-seg" id="segGreen" cx="50" cy="50" r="42" stroke="var(--sage-bright)"></circle>
          <circle class="ring-seg" id="segRed" cx="50" cy="50" r="42" stroke="var(--terracotta-bright)"></circle>
        </svg>
        <div class="ring-center">
          <div class="ring-pct empty" id="pctText">—</div>
          <div class="ring-label">good days</div>
        </div>
      </div>

      <div class="status" id="statusText"></div>

      <div class="buttons">
        <button class="btn btn-green" id="btnGreen">Good day</button>
        <button class="btn btn-red" id="btnRed">Rough day</button>
      </div>

      <div class="totals" id="totalsRow">
        <span class="dot g"></span><span><span class="count" id="countGreen">0</span> good</span>
        <span class="divider"></span>
        <span class="dot r"></span><span><span class="count" id="countRed">0</span> rough</span>
        <span class="divider"></span>
        <span><span class="count" id="countTotal">0</span> days</span>
      </div>
    </div>

    <!-- HISTORY VIEW -->
    <div class="view" id="view-history">
      <div class="cal-header">
        <button class="cal-nav" id="calPrev" aria-label="Previous month">‹</button>
        <div class="cal-month" id="calMonthLabel">—</div>
        <button class="cal-nav" id="calNext" aria-label="Next month">›</button>
      </div>

      <div class="cal-weekdays">
        <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
      </div>

      <div class="cal-grid" id="calGrid"></div>

      <div class="cal-summary" id="calSummary"></div>

      <div class="editor" id="editor">
        <div class="editor-label" id="editorLabel">—</div>
        <div class="editor-buttons">
          <button class="e-green" id="editGreen">Good day</button>
          <button class="e-red" id="editRed">Rough day</button>
          <button class="e-clear" id="editClear">Clear</button>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  const STORAGE_KEY = 'today-app-entries-v1';
  const CIRC = 2 * Math.PI * 42; // r=42

  function toKey(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayKey(){ return toKey(new Date()); }

  function loadEntries(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }

  function saveEntries(entries){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
    catch(e){ console.error('Could not save', e); }
  }

  /* ---------- Tabs ---------- */
  const tabToday = document.getElementById('tabToday');
  const tabHistory = document.getElementById('tabHistory');
  const viewToday = document.getElementById('view-today');
  const viewHistory = document.getElementById('view-history');

  function showTab(name){
    const isToday = name === 'today';
    tabToday.classList.toggle('active', isToday);
    tabHistory.classList.toggle('active', !isToday);
    viewToday.classList.toggle('active', isToday);
    viewHistory.classList.toggle('active', !isToday);
    if(!isToday) renderCalendar();
  }
  tabToday.addEventListener('click', () => showTab('today'));
  tabHistory.addEventListener('click', () => showTab('history'));

  /* ---------- Today view ---------- */
  const dateLabel = document.getElementById('dateLabel');
  const pctText = document.getElementById('pctText');
  const statusText = document.getElementById('statusText');
  const btnGreen = document.getElementById('btnGreen');
  const btnRed = document.getElementById('btnRed');
  const segGreen = document.getElementById('segGreen');
  const segRed = document.getElementById('segRed');
  const countGreen = document.getElementById('countGreen');
  const countRed = document.getElementById('countRed');
  const countTotal = document.getElementById('countTotal');

  [segGreen, segRed].forEach(seg => seg.setAttribute('stroke-dasharray', `0 ${CIRC}`));

  function renderToday(){
    const entries = loadEntries();
    const values = Object.values(entries);
    const green = values.filter(v => v === 'green').length;
    const red = values.filter(v => v === 'red').length;
    const total = green + red;

    dateLabel.textContent = new Date().toLocaleDateString(undefined, {
      weekday: 'long', month: 'long', day: 'numeric'
    });

    countGreen.textContent = green;
    countRed.textContent = red;
    countTotal.textContent = total;

    if(total === 0){
      pctText.textContent = '—';
      pctText.className = 'ring-pct empty';
      segGreen.setAttribute('stroke-dasharray', `0 ${CIRC}`);
      segRed.setAttribute('stroke-dasharray', `0 ${CIRC}`);
    } else {
      const pct = Math.round((green/total)*100);
      pctText.textContent = pct + '%';
      pctText.className = 'ring-pct' + (pct < 50 ? ' low' : '');

      const greenLen = (green/total) * CIRC;
      const redLen = (red/total) * CIRC;
      segGreen.setAttribute('stroke-dasharray', `${greenLen} ${CIRC - greenLen}`);
      segRed.setAttribute('stroke-dasharray', `${redLen} ${CIRC - redLen}`);
      segRed.style.strokeDashoffset = -greenLen;
    }

    const key = todayKey();
    const todays = entries[key];
    if(todays === 'green'){
      statusText.innerHTML = 'Logged as <b>good</b> for today. Tap the other button to change it.';
      btnGreen.classList.add('selected'); btnGreen.classList.remove('dim');
      btnRed.classList.add('dim'); btnRed.classList.remove('selected');
    } else if(todays === 'red'){
      statusText.innerHTML = 'Logged as <b>rough</b> for today. Tap the other button to change it.';
      btnRed.classList.add('selected'); btnRed.classList.remove('dim');
      btnGreen.classList.add('dim'); btnGreen.classList.remove('selected');
    } else {
      statusText.textContent = "Before bed, tap one for today.";
      btnGreen.classList.remove('selected','dim');
      btnRed.classList.remove('selected','dim');
    }
  }

  function log(value){
    const entries = loadEntries();
    entries[todayKey()] = value;
    saveEntries(entries);
    renderToday();
  }

  btnGreen.addEventListener('click', () => log('green'));
  btnRed.addEventListener('click', () => log('red'));

  /* ---------- History / calendar view ---------- */
  const calPrev = document.getElementById('calPrev');
  const calNext = document.getElementById('calNext');
  const calMonthLabel = document.getElementById('calMonthLabel');
  const calGrid = document.getElementById('calGrid');
  const calSummary = document.getElementById('calSummary');
  const editor = document.getElementById('editor');
  const editorLabel = document.getElementById('editorLabel');
  const editGreen = document.getElementById('editGreen');
  const editRed = document.getElementById('editRed');
  const editClear = document.getElementById('editClear');

  const now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth(); // 0-indexed
  let selectedKey = null;

  function closeEditor(){
    selectedKey = null;
    editor.classList.remove('active');
  }

  function renderCalendar(){
    const entries = loadEntries();
    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    const startWeekday = firstOfMonth.getDay(); // 0=Sun
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const todayStr = todayKey();
    const isCurrentMonth = (viewYear === now.getFullYear() && viewMonth === now.getMonth());

    calMonthLabel.textContent = firstOfMonth.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    calNext.disabled = isCurrentMonth;

    calGrid.innerHTML = '';

    for(let i = 0; i < startWeekday; i++){
      const filler = document.createElement('div');
      filler.className = 'cal-cell empty-slot';
      calGrid.appendChild(filler);
    }

    let green = 0, red = 0;

    for(let day = 1; day <= daysInMonth; day++){
      const d = new Date(viewYear, viewMonth, day);
      const key = toKey(d);
      const val = entries[key];
      const isFuture = d > now && key !== todayStr;

      const cell = document.createElement('button');
      cell.className = 'cal-cell';
      cell.textContent = day;
      cell.dataset.key = key;

      if(val === 'green'){ cell.classList.add('has-entry','green'); green++; }
      else if(val === 'red'){ cell.classList.add('has-entry','red'); red++; }

      if(key === todayStr) cell.classList.add('today-marker');
      if(isFuture){ cell.classList.add('future'); cell.disabled = true; }
      else { cell.classList.add('clickable'); }

      if(key === selectedKey) cell.classList.add('selected');

      if(!isFuture){
        cell.addEventListener('click', () => {
          selectedKey = (selectedKey === key) ? null : key;
          renderCalendar();
          if(selectedKey){
            const label = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
            editorLabel.textContent = label;
            editor.classList.add('active');
          } else {
            editor.classList.remove('active');
          }
        });
      }

      calGrid.appendChild(cell);
    }

    const total = green + red;
    calSummary.textContent = total > 0
      ? `${green} good · ${red} rough this month`
      : 'No entries logged this month yet.';
  }

  calPrev.addEventListener('click', () => {
    viewMonth--;
    if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    closeEditor();
    renderCalendar();
  });

  calNext.addEventListener('click', () => {
    if(calNext.disabled) return;
    viewMonth++;
    if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    closeEditor();
    renderCalendar();
  });

  function setSelectedEntry(value){
    if(!selectedKey) return;
    const entries = loadEntries();
    if(value === null) delete entries[selectedKey];
    else entries[selectedKey] = value;
    saveEntries(entries);
    closeEditor();
    renderCalendar();
    renderToday();
  }

  editGreen.addEventListener('click', () => setSelectedEntry('green'));
  editRed.addEventListener('click', () => setSelectedEntry('red'));
  editClear.addEventListener('click', () => setSelectedEntry(null));

  /* ---------- Init ---------- */
  renderToday();
  renderCalendar();

  // Keep things correct if the app is left open past midnight
  setInterval(() => {
    renderToday();
    if(viewHistory.classList.contains('active')) renderCalendar();
  }, 60 * 1000);
})();
</script>
</body>
</html>
